name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build APK
        run: |
          mkdir www
          cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "বিসমিল্লাহ স্টোর" com.bismillah.store --web-dir www
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp icon.png $d/ic_launcher.png
            cp icon.png $d/ic_launcher_round.png
            cp icon.png $d/ic_launcher_foreground.png
          done
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../bismillah-store.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v${{ github.run_number }} bismillah-store.apk --title "বিসমিল্লাহ স্টোর v${{ github.run_number }}" --notes "APK ডাউনলোড করুন"
