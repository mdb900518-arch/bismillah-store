<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>বিসমিল্লাহ স্টোর</title>
<style>
:root{--g:#1b7f3b;--gd:#0f5a28;--gl:#e6f4ea;--bg:#f5faf6;--r:#c62828;--t:#17261c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}header a{font-size:24px;cursor:pointer}
main{padding:14px;max-width:560px;margin:0 auto}
.hero{background:var(--g);color:#fff;text-align:center;padding:calc(28px + env(safe-area-inset-top)) 16px 30px;border-radius:0 0 28px 28px}
.hero .lg{width:96px;height:96px;border-radius:22px;margin:0 auto 10px;display:block;background:#fff}
.hero h1{margin:0;font-size:26px}.hero p{margin:4px 0 0;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 14px;max-width:560px;margin:auto}
.card{background:#fff;border:2px solid var(--gl);border-radius:20px;padding:26px 8px;text-align:center;font-size:20px;font-weight:700;color:var(--gd);cursor:pointer}
.card span{display:block;font-size:44px;margin-bottom:6px}
.b{background:var(--g);color:#fff;border:2px solid var(--g);border-radius:12px;padding:12px;font:inherit;font-weight:600;width:100%;margin:6px 0;cursor:pointer}
.b.o{background:#fff;color:var(--g)}.b.r{background:var(--r);border-color:var(--r)}
.row{display:flex;gap:8px}
.sum{background:var(--gl);border-radius:16px;padding:14px;text-align:center;margin-bottom:10px;color:var(--gd)}
.sum b,.mini b{display:block;font-size:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.mini{background:#fff;border:1px solid var(--gl);border-radius:12px;padding:10px;text-align:center;font-size:14px}.mini b{font-size:18px}
.it{background:#fff;border:1px solid var(--gl);border-radius:14px;padding:12px;margin:8px 0;display:flex;align-items:center;gap:8px}
.it>div:first-child{flex:1;min-width:0}.it small{display:block;color:#5d7064;overflow-wrap:anywhere}
.am{font-weight:700;color:var(--r)}.am.g{color:var(--g)}
.ac a{font-size:20px;margin-left:10px;cursor:pointer}
.inf{color:#5d7064;margin:4px 0}h3{margin:14px 0 4px;color:var(--gd)}
.md{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--gd)}
input,textarea,select{width:100%;padding:11px;border:1.5px solid #b7d7c0;border-radius:10px;font:inherit}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .b{margin:0;padding:8px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:30;display:none}
.empty{text-align:center;color:#5d7064;padding:24px}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const K='bismillah_store_db';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{c:[],s:[],e:[],t:[],x:[],k:[]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('সেভ করা যায়নি')}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bn=n=>'৳ '+(Math.round(n*100)/100).toLocaleString('bn-BD');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x.a),0);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
let view={n:'home'};
function go(n,p){view={n,...p};render();scrollTo(0,0)}
function shell(t,back,h){$('#app').innerHTML=`<header><a onclick="go('${back}')">←</a><h1>${t}</h1></header><main>${h}</main>`}
function form(title,fields,val,cb){const m=document.createElement('div');m.className='md';
m.innerHTML=`<div class=box><h3>${title}</h3>${fields.map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" type="${f[2]||'text'}" value="${esc(val[f[0]])}">`).join('')}<div class=row style="margin-top:12px"><button class=b id=ok>সেভ</button><button class="b o" id=no>বাতিল</button></div></div>`;
document.body.appendChild(m);$('#no').onclick=()=>m.remove();
$('#ok').onclick=()=>{const o={};fields.forEach(f=>o[f[0]]=$('#f_'+f[0]).value.trim());if(cb(o))m.remove()}}
function ask(msg,cb){const d=document.createElement('div');d.className='md';d.innerHTML=`<div class=box><p>${msg}</p><div class=row><button class="b r" id=y>হ্যাঁ</button><button class="b o" id=n>না</button></div></div>`;document.body.appendChild(d);$('#n').onclick=()=>d.remove();$('#y').onclick=()=>{d.remove();cb()}}

const P={c:{t:'কাস্টমার',buy:'মাল কেনা',pay:'টাকা জমা',due:'মোট বাকি'},s:{t:'সাপ্লায়ার',buy:'মাল কেনা',pay:'টাকা পরিশোধ',due:'মোট দেনা'}};
const bal=(k,id)=>sum(db.t.filter(x=>x.k==k&&x.p==id),x=>x.y=='b'?x.a:-x.a);
const FT=[['d','তারিখ','date'],['a','টাকার পরিমাণ','number'],['n','বিবরণ']];
function txForm(store,rec,title){form(title,FT,rec,o=>{const a=parseFloat(o.a);
if(!(a>0)||!o.d){toast('তারিখ ও সঠিক টাকা দিন');return false}
Object.assign(rec,{d:o.d,a,n:o.n});if(!db[store].includes(rec))db[store].push(rec);save();render();return true})}
const ed=(s,id)=>txForm(s,db[s].find(x=>x.id==id),'সম্পাদনা');
const del=(s,id)=>ask('এই হিসাবটি মুছবেন?',()=>{db[s]=db[s].filter(x=>x.id!=id);save();render()});
const rowH=(s,x,l,c)=>`<div class=it><div><b>${l}</b><small>${x.d} ${esc(x.n)}</small></div><div class="am ${c||''}">${bn(x.a)}</div><div class=ac><a onclick="ed('${s}','${x.id}')">✎</a><a onclick="del('${s}','${x.id}')">🗑</a></div></div>`;
const addT=(k,p,y,l)=>txForm('t',{id:uid(),k,p,y,d:today(),a:'',n:''},l);

function render(){const v=view;({home,c:()=>people('c'),s:()=>people('s'),e:emps,d:det,ed:empDet,k:coll,acc})[v.n]()}

function home(){$('#app').innerHTML=`<div class=hero><img class=lg src="logo.png" alt="লোগো"><h1>বিসমিল্লাহ স্টোর</h1><p>হিসাব-নিকাশ</p></div>
<div class=grid><div class=card onclick="go('c')"><span>👥</span>কাস্টমার</div><div class=card onclick="go('s')"><span>🚚</span>সাপ্লায়ার</div><div class=card onclick="go('e')"><span>🧑‍💼</span>কর্মচারী</div><div class=card onclick="go('k')"><span>💰</span>কালেকশন</div></div>
<main><button class="b o" onclick="go('acc')">📊 হিসাব, রিপোর্ট ও ব্যাকআপ</button></main>`}

function pForm(k,r){const f=[['name','নাম']];if(k=='e')f.push(['salary','মাসিক বেতন','number']);else{f.push(['phone','মোবাইল নম্বর','tel']);if(k=='c')f.push(['addr','ঠিকানা'])}
form(r?'সম্পাদনা':'নতুন যোগ করুন',f,r||{},o=>{if(!o.name){toast('নাম লিখুন');return false}
if(k=='e')o.salary=parseFloat(o.salary)||0;if(r)Object.assign(r,o);else db[k].push({id:uid(),...o});save();render();return true})}
const delP=(k,id)=>ask('এই তথ্য ও এর সব হিসাব মুছে যাবে। মুছবেন?',()=>{db[k]=db[k].filter(x=>x.id!=id);db.t=db.t.filter(x=>!(x.k==k&&x.p==id));save();go(k)});

function people(k){const p=P[k],L=db[k],tot=sum(L,x=>bal(k,x.id));
shell(p.t,'home',`<div class=sum>${p.due}<b>${bn(tot)}</b></div><button class=b onclick="pForm('${k}')">+ নতুন ${p.t}</button>`+(L.length?L.map(x=>`<div class=it onclick="go('d',{k:'${k}',id:'${x.id}'})"><div><b>${esc(x.name)}</b><small>${esc(x.phone)}</small></div><div class=am>${bn(bal(k,x.id))}</div></div>`).join(''):`<div class=empty>এখনও কোনো ${p.t} নেই। উপরের বাটনে চাপ দিন।</div>`))}

function det(){const{k,id}=view,p=db[k].find(x=>x.id==id);if(!p)return go(k);const q=P[k];
const T=db.t.filter(x=>x.k==k&&x.p==id).sort((a,b)=>b.d.localeCompare(a.d)),b=sum(T.filter(x=>x.y=='b')),pd=sum(T.filter(x=>x.y=='p'));
shell(esc(p.name),k,`<div class=sum>${q.due}<b>${bn(b-pd)}</b></div><div class=two><div class=mini>${q.buy}<b>${bn(b)}</b></div><div class=mini>${q.pay}<b>${bn(pd)}</b></div></div>
<p class=inf>📞 ${esc(p.phone||'-')} ${p.addr?'• '+esc(p.addr):''}</p>
<div class=row><button class=b onclick="addT('${k}','${id}','b','${q.buy}')">+ ${q.buy}</button><button class="b o" onclick="addT('${k}','${id}','p','${q.pay}')">+ ${q.pay}</button></div>
<div class=row><button class="b o" onclick="pForm('${k}',db['${k}'].find(x=>x.id=='${id}'))">✎ তথ্য</button><button class="b r" onclick="delP('${k}','${id}')">🗑 মুছুন</button></div>
<h3>রিপোর্ট (সব হিসাব)</h3>`+(T.length?T.map(x=>rowH('t',x,x.y=='b'?q.buy:q.pay,x.y=='p'?'g':'')).join(''):'<div class=empty>কোনো হিসাব নেই</div>'))}

const mon=()=>view.m||today().slice(0,7);
const eTx=(id,m)=>db.t.filter(x=>x.k=='e'&&x.p==id&&x.d.startsWith(m));
const eDue=(e,m)=>{const T=eTx(e.id,m);return[sum(T.filter(x=>x.y=='a')),sum(T.filter(x=>x.y=='p'))]};
function emps(){const m=mon();
shell('কর্মচারী','home',`<label>মাস</label><input type=month value="${m}" onchange="go('e',{m:this.value})"><button class=b onclick="pForm('e')">+ নতুন কর্মচারী</button>`+
(db.e.length?db.e.map(e=>{const[a,p]=eDue(e,m);return`<div class=it onclick="go('ed',{id:'${e.id}',m:'${m}'})"><div><b>${esc(e.name)}</b><small>বেতন ${bn(e.salary)} • অগ্রিম ${bn(a)} • পরিশোধ ${bn(p)}</small></div><div class=am>বাকি<br>${bn(e.salary-a-p)}</div></div>`}).join(''):'<div class=empty>এখনও কোনো কর্মচারী নেই</div>'))}
function empDet(){const e=db.e.find(x=>x.id==view.id);if(!e)return go('e');const m=mon(),[a,p]=eDue(e,m),T=eTx(e.id,m).sort((x,y)=>y.d.localeCompare(x.d));
shell(esc(e.name),'e',`<label>মাস</label><input type=month value="${m}" onchange="go('ed',{id:'${e.id}',m:this.value})">
<div class=sum style="margin-top:10px">বাকি বেতন<b>${bn(e.salary-a-p)}</b></div><div class=two><div class=mini>মাসিক বেতন<b>${bn(e.salary)}</b></div><div class=mini>অগ্রিম + পরিশোধ<b>${bn(a+p)}</b></div></div>
<div class=row><button class=b onclick="addT('e','${e.id}','a','অগ্রিম')">+ অগ্রিম</button><button class="b o" onclick="addT('e','${e.id}','p','বেতন পরিশোধ')">+ বেতন পরিশোধ</button></div>
<div class=row><button class="b o" onclick="pForm('e',db.e.find(x=>x.id=='${e.id}'))">✎ তথ্য</button><button class="b r" onclick="delP('e','${e.id}')">🗑 মুছুন</button></div><h3>এই মাসের হিসাব</h3>`+
(T.length?T.map(x=>rowH('t',x,x.y=='a'?'অগ্রিম':'বেতন পরিশোধ')).join(''):'<div class=empty>এই মাসে কোনো হিসাব নেই</div>'))}

const addK=y=>txForm('k',{id:uid(),y,d:today(),a:'',n:''},y=='in'?'টাকা আদায়':'টাকা জমা');
function coll(){const m=mon(),T=db.k.filter(x=>x.d.startsWith(m)).sort((a,b)=>b.d.localeCompare(a.d)),td=db.k.filter(x=>x.d==today());
const f=(L,y)=>sum(L.filter(x=>x.y==y));
shell('কালেকশন','home',`<div class=two><div class=mini>আজ আদায়<b>${bn(f(td,'in'))}</b></div><div class=mini>আজ জমা<b>${bn(f(td,'out'))}</b></div><div class=mini>মাসে আদায়<b>${bn(f(T,'in'))}</b></div><div class=mini>মাসে জমা<b>${bn(f(T,'out'))}</b></div></div>
<div class=row><button class=b onclick="addK('in')">+ টাকা আদায়</button><button class="b o" onclick="addK('out')">+ টাকা জমা</button></div>
<label>মাস (মাসিক রিপোর্ট)</label><input type=month value="${m}" onchange="go('k',{m:this.value})">`+
(T.length?T.map(x=>rowH('k',x,x.y=='in'?'টাকা আদায়':'টাকা জমা',x.y=='in'?'g':'')).join(''):'<div class=empty>এই মাসে কোনো এন্ট্রি নেই</div>'))}

const addX=()=>txForm('x',{id:uid(),d:today(),a:'',n:''},'অন্যান্য খরচ');
function acc(){const pt=view.pt||'m',pd=view.pd||today(),pre=pd.slice(0,{d:10,m:7,y:4}[pt]);
const F=a=>a.filter(x=>x.d.startsWith(pre)),T=F(db.t),X=F(db.x);
const sale=sum(T.filter(x=>x.k=='c'&&x.y=='b')),buy=sum(T.filter(x=>x.k=='s'&&x.y=='b')),oth=sum(X),sal=sum(T.filter(x=>x.k=='e')),
inc=sale,out=buy+oth+sal,pr=inc-out,rec=sum(db.c,x=>bal('c',x.id)),pay=sum(db.s,x=>bal('s',x.id));
const tb=(k,l)=>`<button class="b ${pt==k?'':'o'}" onclick="go('acc',{pt:'${k}',pd:'${pd}'})">${l}</button>`;
shell('হিসাব ও রিপোর্ট','home',`<div class=tabs>${tb('d','দৈনিক')}${tb('m','মাসিক')}${tb('y','বার্ষিক')}</div><input type=date value="${pd}" onchange="go('acc',{pt:'${pt}',pd:this.value})">
<div class=sum style="margin-top:10px">${pr>=0?'প্রকৃত লাভ':'প্রকৃত লোকসান'}<b style="color:${pr>=0?'var(--g)':'var(--r)'}">${bn(Math.abs(pr))}</b></div>
<div class=two><div class=mini>মোট বিক্রি (আয়)<b>${bn(inc)}</b></div><div class=mini>মোট ব্যয়<b>${bn(out)}</b></div><div class=mini>মোট মাল কেনা<b>${bn(buy)}</b></div><div class=mini>কর্মচারীর বেতন<b>${bn(sal)}</b></div><div class=mini>অন্যান্য খরচ<b>${bn(oth)}</b></div><div class=mini>কালেকশন আদায়<b>${bn(sum(F(db.k).filter(x=>x.y=='in')))}</b></div></div>
<div class=two><div class=mini>কাস্টমারের কাছে পাওনা<b>${bn(rec)}</b></div><div class=mini>সাপ্লায়ারের কাছে দেনা<b>${bn(pay)}</b></div></div>
<button class=b onclick="addX()">+ অন্যান্য খরচ যোগ</button>`+X.map(x=>rowH('x',x,'খরচ')).join('')+
`<h3>ব্যাকআপ ও Restore</h3><button class=b onclick="bk()">⬇ ব্যাকআপ ফাইল সেভ করুন</button><button class="b o" onclick="bkc()">📋 ব্যাকআপ কপি করুন</button>
<label>Restore (ব্যাকআপ ফাইল বেছে নিন)</label><input type=file accept=".json,application/json" onchange="imp(this)">
<p class=inf>ফাইলটি Google Drive-এ আপলোড করে রাখলে তথ্য নিরাপদ থাকবে।</p>`)}
const bk=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='bismillah-backup-'+today()+'.json';a.click();toast('ব্যাকআপ সেভ হচ্ছে')};
const bkc=()=>{navigator.clipboard.writeText(JSON.stringify(db)).then(()=>toast('কপি হয়েছে'),()=>toast('কপি করা যায়নি'))};
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.t||!d.c)throw 0;ask('বর্তমান সব তথ্য মুছে ব্যাকআপ ফিরিয়ে আনবেন?',()=>{db=d;save();toast('Restore হয়েছে');go('home')})}catch(e){toast('ভুল ব্যাকআপ ফাইল')}};r.readAsText(f)}
render();
</script></body></html>
